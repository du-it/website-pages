<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <!-- Weißer Hintergrund mit abgerundeten Ecken und feinem grauen Rahmen -->
  <rect x="20" y="20" width="680" height="680" rx="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="16" />
  
  <!-- Absolut zentrierter, filigranerer Text (font-weight: 600 statt 900) -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="600" font-size="150" letter-spacing="-3">
    <tspan fill="#0f172a">{</tspan><tspan fill="#0284c7">du</tspan><tspan fill="#0f172a">-</tspan><tspan fill="#0284c7">it</tspan><tspan fill="#0f172a">}</tspan>
  </text>
</svg>