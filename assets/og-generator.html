<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OG-Preview Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0 p-4">

<!-- Exakter Open-Graph Container (1200x630, zentriert) -->
<div id="og-card" style="width: 1200px; height: 630px; background-color: #020617; color: #f8fafc; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); flex-shrink: 0;">

    <!-- Hintergrund Glow-Effekte -->
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 400px; background: rgba(14, 165, 233, 0.1); filter: blur(140px); border-radius: 9999px; pointer-events: none;"></div>
    <div style="position: absolute; bottom: 40px; right: 40px; width: 350px; height: 350px; background: rgba(56, 189, 248, 0.1); filter: blur(120px); border-radius: 9999px; pointer-events: none;"></div>

    <!-- Inhalt (Zentriert) -->
    <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; max-width: 1000px; gap: 2rem;">

        <!-- Logo & Slogan Badge (Angepasst auf {du-it}) -->
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 64px; height: 64px; border-radius: 1rem; background: linear-gradient(to bottom right, #0ea5e9, #38bdf8); display: flex; align-items: center; justify-content: center; color: #020617; font-weight: 900; font-size: 28px; font-family: monospace; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
                {du}
            </div>
            <div style="text-align: left;">
                <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.025em; color: #ffffff; display: block; line-height: 1;">du-it</span>
                <span style="font-size: 11px; padding: 4px 10px; border-radius: 4px; background: rgba(14, 165, 233, 0.2); color: #0ea5e9; border: 1px solid rgba(14, 165, 233, 0.3); font-family: monospace; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; display: inline-block;">Smart Java Development</span>
            </div>
        </div>

        <!-- Haupttitel (Rolle) -->
        <h1 style="font-size: 56px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff; line-height: 1.15; margin: 0;">
            Senior Developer &amp; <br>
            <span style="background: linear-gradient(to right, #38bdf8, #06b6d4, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    Java Backend Spezialist
                </span>
        </h1>

        <!-- Untertitel / Erfahrung -->
        <p style="font-size: 20px; color: #94a3b8; font-weight: 500; max-width: 900px; line-height: 1.5; margin: 0;">
            25+ Jahre Softwareentwicklung • Spring Boot • Microservices • Hexagonale Architektur • Cloud
        </p>

    </div>

    <!-- Footer / Domain unten im Bild -->
    <div style="position: absolute; bottom: 30px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-family: monospace; color: #64748b; z-index: 10;">
        <span>www.du-it.de</span>
        <span>•</span>
        <span>Dirk Ulrich</span>
    </div>

</div>

</body>
</html>
