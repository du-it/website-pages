<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiken (Intern)</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full p-8 bg-zinc-900 border border-zinc-800 rounded-2xl text-center">
        <h1 class="text-2xl font-bold mb-4">Seitenaufrufe</h1>
        <p class="text-5xl font-mono text-cyan-400 mb-6" id="view-counter">...</p>
        <p class="text-sm text-zinc-400 mb-4">(Nur auf diesem Gerät via LocalStorage)</p>
        <button onclick="resetCounter()" class="px-4 py-2 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs hover:bg-red-500/30 transition">Reset</button>
    </div>

    <script>
        // Zähler aus dem LocalStorage lesen
        const counter = localStorage.getItem('page_views') || '0';
        document.getElementById('view-counter').textContent = counter;

        function resetCounter() {
            localStorage.setItem('page_views', '0');
            document.getElementById('view-counter').textContent = '0';
        }
    </script>
</body>
</html>
