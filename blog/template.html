<!DOCTYPE html>
<html lang="de" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Artikel | du-it Blog</title>

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/all.min.css">
    <!-- Lokale Einstellungen und Fonts -->
    <link rel="stylesheet" href="../css/blog.css">

    <script src="../js/theme-loader.js"></script>
    <script type="module" src="../js/app.js"></script>
</head>
<body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white flex flex-col justify-between">

<!-- Header Navigation -->
<header id="main-header" class="fixed top-0 left-0 right-0 z-50 glass transition-all duration-300"></header>

<!-- Haupt-Layout: Schlankes Ein-Spalten-Layout (max-w-3xl) -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-28 pb-12 flex-grow w-full space-y-10">
    <!-- Hier wird renderArticleHeader() gerendert -->
    <div id="article-header-container"></div>

    <!-- Key Takeaways Box (wird dynamisch befüllt) -->
    <div id="article-takeaways-container"></div>

    <!-- Hier hinein wird der freie Artikel aus posts/*.html geladen -->
    <div id="article-content-body" class="w-full"></div>

    <!-- Autor Box & Abschluss am Ende des Artikels -->
    <div class="pt-8 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center gap-6 bg-white dark:bg-slate-900/60 p-6 rounded-2xl shadow-sm dark:shadow-none border border-slate-200 dark:border-slate-800">
        <img src="../assets/dirk-ulrich-profile-1.png" alt="Dirk Ulrich" class="w-20 h-20 rounded-2xl object-cover border-2 border-purple-500/30 flex-shrink-0">
        <div>
            <h4 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Dirk Ulrich</h4>
            <p class="text-xs font-mono text-purple-600 dark:text-purple-400 mb-2">Dipl.-Inf. (FH) / Senior Java Backend Developer</p>
            <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                Seit über 25 Jahren freiberuflicher Softwareentwickler im Enterprise-Umfeld mit Spezialisierung auf Java, Spring Boot Microservices und moderne KI-Integrationsmuster.
            </p>
        </div>
    </div>
</main>

<footer id="main-footer"></footer>

</body>
</html>
